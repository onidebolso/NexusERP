<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus ERP - Estoque</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div>
          <p class="tag">Nexus ERP</p>
          <h1>Controle de Estoque</h1>
        </div>
        <div class="badge" id="totalProdutos">0 produtos</div>
      </header>

      <main class="grid">
        <section class="card">
          <h2>Adicionar produto</h2>
          <form id="produtoForm">
            <div class="field-grid">
              <label>
                Nome
                <input type="text" name="nome" required />
              </label>
              <label>
                Categoria
                <input type="text" name="categoria" required />
              </label>
              <label>
                Quantidade
                <input type="number" name="quantidade" min="0" required />
              </label>
              <label>
                Preço
                <input type="number" name="preco" min="0" step="0.01" required />
              </label>
              <label>
                Código de barras
                <input type="text" name="codigo_barras" />
              </label>
              <label>
                Fornecedor
                <input type="text" name="fornecedor" />
              </label>
            </div>
            <button type="submit">Salvar produto</button>
          </form>
          <div id="mensagem" class="mensagem" aria-live="polite"></div>
        </section>

        <section class="card">
          <h2>Consultar produtos</h2>
          <div class="search-box">
            <input id="buscarInput" type="text" placeholder="Buscar por nome, categoria ou código..." />
            <button id="buscarBtn" type="button">Buscar</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Categoria</th>
                  <th>Qtd</th>
                  <th>Preço</th>
                  <th>Fornecedor</th>
                  <th>Data</th>
                </tr>
              </thead>
              <tbody id="tabelaProdutos"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
